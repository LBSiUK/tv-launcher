<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Launcher</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="assets/fonts/figtree-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="room">
    <div class="tv" id="tv" tabindex="-1" aria-label="TV screen">
      <nav class="homebar" id="homebar" aria-label="Home">
        <div class="tiles" role="toolbar" aria-label="Apps and sources" aria-orientation="horizontal">
          <button class="tile tile--smarthub" type="button" aria-label="Smart Hub">
            <img class="logo logo--light" src="assets/logos/smarthub.png" alt="">
            <img class="logo logo--dark" src="assets/logos/smarthub-dark.png" alt="">
          </button>
          <button class="tile tile--source tile--usb" type="button" aria-label="USB">
            <svg class="glyph" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M428-100q-20-20-20-52 0-22 11-40t31-29v-111H302q-24 0-42-18t-18-42v-109q-20-9-31-26.61t-11-40.11Q200-600 220-620t52-20q32 0 52 20t20 52.41q0 22.59-11 40.09-11 17.5-31 26.5v109h148v-340h-80l110-149 110 149h-80v340h148v-104h-42v-144h144v144h-42v104q0 24-18 42t-42 18H510v111q19.95 10.65 30.97 29.83Q552-172 552-152q0 32-20 52t-52 20q-32 0-52-20Z"/></svg>
            <span class="label">USB</span>
          </button>
          <button class="tile tile--source tile--hdmi" type="button" aria-label="HDMI 1">
            <svg class="glyph" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M320-80v-120L200-439v-241h40v-140q0-23 18.5-41.5T300-880h360q23 0 41.5 18.5T720-820v140h40v241L640-200v120H320Zm-20-600h98v-82h34v82h96v-82h34v82h98v-140H300v140Zm80 540h200v-75l120-241v-164H260v164l120 241v75Zm100-316Z"/></svg>
            <span class="label">HDMI 1</span>
          </button>
          <button class="tile tile--source tile--component" type="button" aria-label="Component Video">
            <svg class="glyph" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M123-40v-170q-34-13-58.5-42.5T40-317v-398h83v-175q0-14 8-22t22-8q14 0 22 8t8 22v175h83v398q0 35-24 64.5T183-210v170h-60Zm327 0v-170q-34-13-58.5-42.5T367-317v-398h83v-175q0-14 8-22t22-8q14 0 22 8t8 22v175h83v398q0 35-24 64.5T510-210v170h-60Zm327 0v-170q-34-13-58.5-42.5T694-317v-398h83v-175q0-14 8-22t22-8q14 0 22 8t8 22v175h83v398q0 35-24.5 64.5T837-210v170h-60ZM100-655v184h106v-184H100Zm327 0v184h106v-184H427Zm327 0v184h106v-184H754ZM153-267q22 0 37.5-15t15.5-35v-94H100v94q0 20 15.5 35t37.5 15Zm327 0q22 0 37.5-15t15.5-35v-94H427v94q0 20 15.5 35t37.5 15Zm327 0q22 0 37.5-15t15.5-35v-94H754v94q0 20 15.5 35t37.5 15ZM153-441Zm327 0Zm327 0Z"/></svg>
            <span class="label">Component Video</span>
          </button>
          <button class="tile tile--youtube" type="button" aria-label="YouTube">
            <img class="logo" src="assets/logos/youtube.svg" alt="">
          </button>
          <button class="tile tile--iplayer" type="button" aria-label="BBC iPlayer">
            <img class="logo" src="assets/logos/iplayer.svg" alt="">
          </button>
          <button class="tile tile--netflix" type="button" aria-label="Netflix">
            <img class="logo" src="assets/logos/netflix.svg" alt="">
          </button>
          <button class="tile tile--prime" type="button" aria-label="Prime Video">
            <img class="logo" src="assets/logos/primevideo.svg" alt="">
          </button>
          <button class="tile tile--browser" type="button" aria-label="Web Browser">
            <svg class="glyph" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M323-111.5Q250-143 196-197t-85-127.5Q80-398 80-482t31-156.5Q142-711 196-765t127-84.5Q396-880 480-880t157 30.5Q710-819 764-765t85 126.5Q880-566 880-482t-31 157.5Q818-251 764-197t-127 85.5Q564-80 480-80t-157-31.5ZM480-138q35-36 58.5-82.5T577-331H384q14 60 37.5 108t58.5 85Zm-85-12q-25-38-43-82t-30-99H172q38 71 88 111.5T395-150Zm171-1q72-23 129.5-69T788-331H639q-13 54-30.5 98T566-151ZM152-391h159q-3-27-3.5-48.5T307-482q0-25 1-44.5t4-43.5H152q-7 24-9.5 43t-2.5 45q0 26 2.5 46.5T152-391Zm221 0h215q4-31 5-50.5t1-40.5q0-20-1-38.5t-5-49.5H373q-4 31-5 49.5t-1 38.5q0 21 1 40.5t5 50.5Zm275 0h160q7-24 9.5-44.5T820-482q0-26-2.5-45t-9.5-43H649q3 35 4 53.5t1 34.5q0 22-1.5 41.5T648-391Zm-10-239h150q-33-69-90.5-115T565-810q25 37 42.5 80T638-630Zm-254 0h194q-11-53-37-102.5T480-820q-32 27-54 71t-42 119Zm-212 0h151q11-54 28-96.5t43-82.5q-75 19-131 64t-91 115Z"/></svg>
            <span class="label">Web Browser</span>
          </button>
        </div>
      </nav>
      <p class="sr-only" id="announce" aria-live="polite"></p>
    </div>

    <ul class="keys" aria-label="Controls">
      <li><kbd>Space</kbd> Home</li>
      <li>
        <kbd aria-label="Left arrow"><svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="m274-450 248 248-42 42-320-320 320-320 42 42-248 248h526v60H274Z"/></svg></kbd>
        <kbd aria-label="Right arrow"><svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M686-450H160v-60h526L438-758l42-42 320 320-320 320-42-42 248-248Z"/></svg></kbd>
        Select
      </li>
      <li><kbd>Enter</kbd> Pick up or put down</li>
      <li><kbd>T</kbd> Light or dark</li>
    </ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
